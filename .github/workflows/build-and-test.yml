name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  validate-dotnet:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: GridForge
    env:
      # PRs use their target branch; develop -> main validates released packages.
      UseLocalLsfStack: ${{ (github.base_ref == 'develop' || github.ref == 'refs/heads/develop') && 'true' || 'false' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Release, ReleaseLean]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: GridForge
          fetch-depth: 0
          persist-credentials: false

      # Immutable sibling revisions are used only for develop source validation.
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/Chronicler
          ref: 7b90d5923d4bb6e0e42c033ec697b9678d6b8ece
          path: Chronicler
          persist-credentials: false
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/FixedMathSharp
          ref: e2c325a827506419b1a04b2427d9bc77e629ab6f
          path: FixedMathSharp
          persist-credentials: false
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/SwiftCollections
          ref: e275e18d3b100204a55ed0b392a45ad6cb5b6eb2
          path: SwiftCollections
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.4.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          targetPath: GridForge

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-
            ${{ runner.os }}-lsf-${{ env.UseLocalLsfStack }}-nuget-

      # Pass globally so sibling projects preserve explicit source-reference identities.
      - name: Restore dependencies
        run: dotnet restore GridForge.slnx --property:Configuration=${{ matrix.configuration }} -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }} -m:1

      - name: Build Solution
        run: |
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Assembly Version: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          dotnet build GridForge.slnx --configuration ${{ matrix.configuration }} --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }} -m:1 -p:BuildInParallel=false

      - name: Run Tests
        run: dotnet test GridForge.slnx --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }} -m:1 --verbosity normal
  validate-wiki-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate wiki link rewrite helper
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/rewrite_wiki_links_for_github_wiki_tests.py
